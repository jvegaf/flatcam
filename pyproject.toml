[project]
name = "flatcam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose Vega", email = "josevega234@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cycler>=0.10",
    "darkdetect>=0.8.0",
    "dill>=0.4.1",
    "ezdxf>=0.16.0,<2.0.0",
    "fonttools>=4.66.1",
    "freetype-py>=2.5.1",
    "gdal>=3.13.3",
    "greenlet>=3.5.6",
    "kiwisolver>=1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.5.0",
    "numpy>=1.16",
    "ortools>=7.0",
    "pyopengl>=3.1.10",
    "pyppeteer>=0.0.25",
    "pyqt6>=6.1.0",
    "pyserial>=3.4",
    "python-dateutil>=2.1",
    "qrcode>=6.1",
    "rasterio>=1.5.2",
    "reportlab>=3.5",
    "rtree>=1.4.1",
    "setuptools>=84.0.0",
    "shapely>=2.0",
    "simplejson>=4.2.0",
    "six>=1.17.0",
    "svg-path>=4.0",
    "svglib>=2.3.0",
    "svgtrace>=2023.0.1",
    "vispy>=0.9.0",
]

[project.scripts]
flatcam = "flatcam:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
